[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issueops-mcp"
version = "0.2.0"
description = "MCP server and human-approval layer for GitHub issue triage"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "mcp>=2.0,<3",
    "streamlit>=1.50,<2",
    "groq>=0.11,<2",
    "logfire[requests,psycopg]>=0.51",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[tool.setuptools]
packages = ["issueops", "agent", "mcp_server", "evals"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a real Postgres, set ISSUEOPS_TEST_DSN"]
